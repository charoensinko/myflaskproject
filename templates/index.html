<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกการเข้าอบรมคอร์ส</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <!-- Google Fonts - Sarabun for Thai + Playfair Display -->
  <link
    href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Playfair+Display:wght@700;900&display=swap"
    rel="stylesheet">

  <style>
    /* (คง CSS เดิมไว้เกือบทั้งหมด) */
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      --dark-bg: #1a1a2e;
      --card-bg: #ffffff;
      --text-primary: #2d3748;
      --text-secondary: #718096;
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.16);
    }

    * {
      font-family: 'Sarabun', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 1rem 0;
    }

    .main-header {
      background: var(--primary-gradient);
      color: white;
      padding: 1.5rem 0;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .main-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 20s infinite ease-in-out;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }

      33% {
        transform: translate(30px, -30px) rotate(120deg);
      }

      66% {
        transform: translate(-20px, 20px) rotate(240deg);
      }
    }

    .main-header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 2rem;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 1;
    }

    .main-header p {
      font-size: 0.95rem;
      opacity: 0.95;
      position: relative;
      z-index: 1;
      margin: 0;
    }

    .card {
      border: none;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      margin-bottom: 1rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: var(--card-bg);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .card-header {
      background: var(--primary-gradient);
      color: white;
      border-radius: 16px 16px 0 0 !important;
      padding: 0.75rem 1rem;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .btn-gradient-primary {
      background: var(--primary-gradient);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-sm);
    }

    .btn-gradient-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      color: white;
    }

    .btn-gradient-success {
      background: var(--success-gradient);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      transition: all 0.3s ease;
    }

    .btn-gradient-success:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      color: white;
    }

    .btn-gradient-warning {
      background: var(--warning-gradient);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      transition: all 0.3s ease;
    }

    .btn-gradient-warning:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      color: white;
    }

    .form-label {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
      font-size: 0.9rem;
    }

    .form-control,
    .form-select {
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 0.4rem 0.75rem;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.15);
    }

    .table {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .table thead {
      background: var(--primary-gradient);
      color: white;
    }

    .table thead th {
      border: none;
      font-weight: 600;
      padding: 0.6rem;
      font-size: 0.9rem;
    }

    .table tbody tr {
      transition: background-color 0.2s ease;
    }

    .table tbody tr:hover {
      background-color: #f8f9ff;
    }

    .table tbody td {
      padding: 0.5rem;
      font-size: 0.9rem;
      vertical-align: middle;
    }

    .badge-status {
      padding: 0.35rem 0.75rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.75rem;
    }

    .badge-pending {
      background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
      color: #2d3436;
    }

    .badge-approved {
      background: linear-gradient(135deg, #55efc4 0%, #00b894 100%);
      color: white;
    }

    .badge-rejected {
      background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
      color: white;
    }

    .stats-card {
      background: white;
      border-radius: 12px;
      padding: 0.75rem;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .stats-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .stats-number {
      font-size: 1.8rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stats-label {
      color: var(--text-secondary);
      font-weight: 600;
      margin-top: 0.25rem;
      font-size: 0.85rem;
    }

    .action-btn {
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      border: none;
      transition: all 0.2s ease;
      margin: 0 0.15rem;
      font-size: 0.85rem;
    }

    .action-btn:hover {
      transform: scale(1.05);
    }

    .modal-content {
      border: none;
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      background: var(--primary-gradient);
      color: white;
      border-radius: 20px 20px 0 0;
      padding: 1.5rem;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      padding-left: 3rem;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="main-header">
    <div class="container">
      <h1><i class="bi bi-mortarboard-fill me-3"></i>ระบบบันทึกการเข้าอบรมคอร์ส</h1>
      <p class="mb-0">จัดการและติดตามผลการอบรมของพนักงานอย่างมีประสิทธิภาพ</p>
    </div>
  </div>

  <div class="container">
    <!-- Statistics Dashboard -->
    <div class="row mb-2 fade-in">
      <div class="col-md-3 mb-2">
        <div class="stats-card">
          <div class="stats-number" id="totalTrainees">0</div>
          <div class="stats-label">ผู้เข้าอบรมทั้งหมด</div>
        </div>
      </div>
      <div class="col-md-3 mb-2">
        <div class="stats-card">
          <div class="stats-number" id="approvedCount">0</div>
          <div class="stats-label">ผ่านการอบรม</div>
        </div>
      </div>
      <div class="col-md-3 mb-2">
        <div class="stats-card">
          <div class="stats-number" id="pendingCount">0</div>
          <div class="stats-label">รอการตรวจ</div>
        </div>
      </div>
      <div class="col-md-3 mb-2">
        <div class="stats-card">
          <div class="stats-number" id="avgScore">0</div>
          <div class="stats-label">คะแนนเฉลี่ย</div>
        </div>
      </div>
    </div>

    <!-- Form Card -->
    <div class="card fade-in">
      <div class="card-header">
        <i class="bi bi-clipboard-data me-2"></i>บันทึกข้อมูลการเข้าอบรม
      </div>
      <div class="card-body p-3">
        <form id="trainingForm">
          <input type="hidden" id="editId" value="">

          <h6 class="mb-2"><i class="bi bi-person-badge me-2"></i>ข้อมูลส่วนตัว</h6>
          <div class="row mb-2">
            <div class="col-md-4">
              <label class="form-label">รหัสพนักงาน <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="employeeId" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">ชื่อ <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="firstName" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">นามสกุล <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="lastName" required>
            </div>
          </div>

          <div class="row mb-2">
            <div class="col-md-6">
              <label class="form-label">อีเมล <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">แผนก <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="department" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">ตำแหน่ง <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="position" required>
            </div>
          </div>

          <hr class="my-2">

          <h6 class="mb-2"><i class="bi bi-book me-2"></i>ข้อมูลการอบรม</h6>
          <div class="row mb-2">
            <div class="col-md-8">
              <label class="form-label">ชื่อคอร์ส <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="courseName" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">หมวดหมู่</label>
              <select class="form-select" id="courseCategory">
                <option value="เทคโนโลยี">เทคโนโลยี</option>
                <option value="การจัดการ">การจัดการ</option>
                <option value="การตลาด">การตลาด</option>
                <option value="การเงิน">การเงิน</option>
                <option value="ทรัพยากรบุคคล">ทรัพยากรบุคคล</option>
                <option value="อื่นๆ">อื่นๆ</option>
              </select>
            </div>
          </div>

          <div class="row mb-2">
            <div class="col-md-4">
              <label class="form-label">วันที่อบรม <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="trainingDate" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">เวลาเริ่ม</label>
              <input type="time" class="form-control" id="startTime">
            </div>
            <div class="col-md-4">
              <label class="form-label">เวลาสิ้นสุด</label>
              <input type="time" class="form-control" id="endTime">
            </div>
          </div>

          <div class="row mb-2">
            <div class="col-md-6">
              <label class="form-label">ชื่อวิทยากร <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="instructorName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">สถาบัน/องค์กร</label>
              <input type="text" class="form-control" id="institution">
            </div>
          </div>

          <hr class="my-2">

          <h6 class="mb-2"><i class="bi bi-graph-up me-2"></i>ผลการทดสอบ</h6>
          <div class="row mb-2">
            <div class="col-md-3">
              <label class="form-label">คะแนน Pre-Test <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="preTestScore" min="0" max="100" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">คะแนน Post-Test <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="postTestScore" min="0" max="100" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">เกณฑ์ผ่าน (%) <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="passingScore" min="0" max="100" value="70" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">คะแนนรวม (คิดเฉลี่ย)</label>
              <input type="text" class="form-control" id="averageScore" readonly
                style="background-color: #f8f9ff; font-weight: 600;">
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">ไฟล์ Assignment</label>
            <input type="file" class="form-control" id="assignmentFile" accept=".pdf,.doc,.docx,.ppt,.pptx,.zip">
            <small class="text-muted">รองรับไฟล์: PDF, Word, PowerPoint, ZIP (ขนาดไม่เกิน 5MB)</small>
            <div id="currentFile" class="mt-2"></div>
          </div>

          <div class="row mb-2">
            <div class="col-md-6">
              <label class="form-label">สถานะการตรวจ Assignment <span class="text-danger">*</span></label>
              <select class="form-select" id="assignmentStatus" required>
                <option value="รอตรวจ">รอตรวจ</option>
                <option value="ผ่าน">ผ่าน</option>
                <option value="ไม่ผ่าน">ไม่ผ่าน</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">ผลการประเมินโดยรวม</label>
              <select class="form-select" id="overallRating">
                <option value="">-- เลือก --</option>
                <option value="ดีเยี่ยม">ดีเยี่ยม</option>
                <option value="ดีมาก">ดีมาก</option>
                <option value="ดี">ดี</option>
                <option value="พอใช้">พอใช้</option>
                <option value="ควรปรับปรุง">ควรปรับปรุง</option>
              </select>
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">หมายเหตุ/ข้อมูลเพิ่มเติม</label>
            <textarea class="form-control" id="additionalNotes" rows="2"
              placeholder="ข้อเสนอแนะ, ความคิดเห็น, หรือข้อมูลอื่นๆ ที่ต้องการบันทึก"></textarea>
          </div>

          <div class="text-end">
            <button type="button" class="btn btn-secondary me-2" onclick="resetForm()">
              <i class="bi bi-x-circle me-2"></i>ล้างฟอร์ม
            </button>
            <button type="submit" class="btn btn-gradient-primary">
              <i class="bi bi-save me-2"></i>บันทึกข้อมูล
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Records Table Card -->
    <div class="card fade-in">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-table me-2"></i>รายการผู้เข้าอบรม</span>
        <div>
          <button class="btn btn-light btn-sm me-2" onclick="exportToCSV()">
            <i class="bi bi-filetype-csv me-1"></i>Export CSV
          </button>
          <button class="btn btn-light btn-sm" onclick="exportToJSON()">
            <i class="bi bi-filetype-json me-1"></i>Export JSON
          </button>
        </div>
      </div>
      <div class="card-body">
        <!-- Search Box -->
        <div class="row mb-2">
          <div class="col-md-6">
            <div class="search-box">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" id="searchInput"
                placeholder="ค้นหาด้วย ชื่อ, อีเมล, คอร์ส, หรือแผนก...">
            </div>
          </div>
          <div class="col-md-3">
            <select class="form-select" id="filterStatus">
              <option value="">ทุกสถานะ</option>
              <option value="รอตรวจ">รอตรวจ</option>
              <option value="ผ่าน">ผ่าน</option>
              <option value="ไม่ผ่าน">ไม่ผ่าน</option>
            </select>
          </div>
          <div class="col-md-3">
            <select class="form-select" id="filterCategory">
              <option value="">ทุกหมวดหมู่</option>
              <option value="เทคโนโลยี">เทคโนโลยี</option>
              <option value="การจัดการ">การจัดการ</option>
              <option value="การตลาด">การตลาด</option>
              <option value="การเงิน">การเงิน</option>
              <option value="ทรัพยากรบุคคล">ทรัพยากรบุคคล</option>
              <option value="อื่นๆ">อื่นๆ</option>
            </select>
          </div>
        </div>

        <div id="recordsContainer"></div>
      </div>
    </div>
  </div>

  <!-- Certificate Modal (คงของเดิมไว้) -->
  <div class="modal fade" id="certificateModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-award me-2"></i>ใบประกาศนียบัตร</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="certificate-preview" id="certificateContent"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ปิด</button>
          <button type="button" class="btn btn-gradient-success" onclick="downloadCertificate()">
            <i class="bi bi-download me-2"></i>ดาวน์โหลด PDF
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jsPDF for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    /******************************************************************
     * ✅ CONFIG (แก้ 2 ค่านี้ให้ถูกก่อนใช้งาน)
     ******************************************************************/
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwxndmNz7A0a6ct220RYhhPycM6m5DRfbxutA2_kWVN2p7dWQSwCLbk85Es3zUljPyy/exec";
    const API_KEY = "my_hr_app_2026_secret"; // ตั้งค่าใน Script Properties ฝั่ง Apps Script ด้วย

    /******************************************************************
     * State
     ******************************************************************/
    let trainingRecords = [];          // ข้อมูลที่ดึงมาจาก Google Sheets ล่าสุด
    let currentCertificateData = null; // สำหรับใบประกาศ
    window.currentFileData = null;     // ไฟล์ที่อัปโหลดล่าสุด (base64)

    /******************************************************************
     * Boot
     ******************************************************************/
    window.addEventListener('DOMContentLoaded', async function () {
      // Calculate average score automatically
      document.getElementById('preTestScore').addEventListener('input', calculateAverage);
      document.getElementById('postTestScore').addEventListener('input', calculateAverage);

      // Search and filter triggers -> เรียก backend แล้วแสดงผล
      document.getElementById('searchInput').addEventListener('input', debounce(runSearch, 300));
      document.getElementById('filterStatus').addEventListener('change', runSearch);
      document.getElementById('filterCategory').addEventListener('change', runSearch);

      // File upload handler
      document.getElementById('assignmentFile').addEventListener('change', handleFileUpload);

      // Initial load from Google Sheets
      await refreshFromServer();
    });

    function calculateAverage() {
      const preTest = parseFloat(document.getElementById('preTestScore').value) || 0;
      const postTest = parseFloat(document.getElementById('postTestScore').value) || 0;
      const average = ((preTest + postTest) / 2).toFixed(2);
      document.getElementById('averageScore').value = average;
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Check file size (5MB limit) — (ของเดิม)
      if (file.size > 5 * 1024 * 1024) {
        alert('ไฟล์มีขนาดใหญ่เกินกำหนด (สูงสุด 5MB)');
        event.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        // DataURL: data:application/pdf;base64,xxxx
        const fileData = {
          name: file.name,
          type: file.type || 'application/octet-stream',
          size: file.size,
          dataUrl: e.target.result,
        };
        window.currentFileData = fileData;

        document.getElementById('currentFile').innerHTML = `
          <div class="alert alert-info">
            <i class="bi bi-file-earmark me-2"></i>
            <strong>${escapeHtml(file.name)}</strong> (${(file.size / 1024).toFixed(2)} KB)
          </div>
        `;
      };
      reader.readAsDataURL(file);
    }

    /******************************************************************
     * Backend helper (Apps Script Web App)
     ******************************************************************/
    async function callBackend(action, payload = {}) {
        const res = await fetch("/api/gs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, payload })
        });

        const data = await res.json();
        if (!data.ok) {
          throw new Error(data.error || "Backend error");
        }
        return data;
      }
    
    async function refreshFromServer() {
      try {
        const data = await callBackend("listRecords", {});
        trainingRecords = data.records || [];
        displayRecords(trainingRecords);
        updateStatistics(trainingRecords);
      } catch (err) {
        console.error(err);
        showToast(`โหลดข้อมูลไม่สำเร็จ: ${err.message}`, 'danger');
        // fallback: โชว์ empty state
        trainingRecords = [];
        displayRecords([]);
        updateStatistics([]);
      }
    }

    async function runSearch() {
      try {
        const searchTerm = document.getElementById('searchInput').value.trim();
        const statusFilter = document.getElementById('filterStatus').value;
        const categoryFilter = document.getElementById('filterCategory').value;

        const data = await callBackend("queryRecords", {
          q: searchTerm,
          status: statusFilter,
          category: categoryFilter
        });

        trainingRecords = data.records || [];
        displayRecords(trainingRecords);
        updateStatistics(trainingRecords);
      } catch (err) {
        console.error(err);
        showToast(`ค้นหาไม่สำเร็จ: ${err.message}`, 'danger');
      }
    }

    function updateStatistics(records) {
      const total = records.length;
      const approved = records.filter(r => r.assignmentStatus === 'ผ่าน').length;
      const pending = records.filter(r => r.assignmentStatus === 'รอตรวจ').length;
      const avgScore = total > 0 ?
        (records.reduce((sum, r) => sum + Number(r.averageScore || 0), 0) / total).toFixed(2) : 0;

      document.getElementById('totalTrainees').textContent = total;
      document.getElementById('approvedCount').textContent = approved;
      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('avgScore').textContent = avgScore;
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      const options = { year: 'numeric', month: 'short', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('th-TH', options);
    }

    /******************************************************************
     * Export CSV/JSON -> Download ลงเครื่อง (ตาม requirement)
     ******************************************************************/
    function exportToCSV() {
      if (!trainingRecords || trainingRecords.length === 0) {
        alert('ไม่มีข้อมูลให้ Export');
        return;
      }

      const headers = [
        'id', 'timestamp',
        'รหัสพนักงาน', 'ชื่อ', 'นามสกุล', 'อีเมล', 'แผนก', 'ตำแหน่ง',
        'คอร์ส', 'หมวดหมู่', 'วันที่อบรม', 'เวลาเริ่ม', 'เวลาสิ้นสุด',
        'วิทยากร', 'สถาบัน', 'Pre-Test', 'Post-Test', 'เกณฑ์ผ่าน', 'คะแนนเฉลี่ย',
        'สถานะ Assignment', 'ผลการประเมิน', 'หมายเหตุ',
        'Assignment File Name', 'Assignment File URL'
      ];

      let csv = '\uFEFF' + headers.join(',') + '\n';

      trainingRecords.forEach(r => {
        const row = [
          safeCsv(r.id),
          safeCsv(r.timestamp),
          safeCsv(r.employeeId),
          safeCsv(r.firstName),
          safeCsv(r.lastName),
          safeCsv(r.email),
          safeCsv(r.department),
          safeCsv(r.position),
          safeCsv(r.courseName),
          safeCsv(r.courseCategory),
          safeCsv(r.trainingDate),
          safeCsv(r.startTime),
          safeCsv(r.endTime),
          safeCsv(r.instructorName),
          safeCsv(r.institution || ''),
          safeCsv(r.preTestScore),
          safeCsv(r.postTestScore),
          safeCsv(r.passingScore),
          safeCsv(r.averageScore),
          safeCsv(r.assignmentStatus),
          safeCsv(r.overallRating || ''),
          safeCsv(r.additionalNotes || ''),
          safeCsv(r.assignmentFileName || ''),
          safeCsv(r.assignmentFileUrl || ''),
        ];
        csv += row.join(',') + '\n';
      });

      downloadFile(csv, 'training_records.csv', 'text/csv;charset=utf-8;');
      showToast('Export CSV เรียบร้อยแล้ว', 'success');
    }

    function exportToJSON() {
      if (!trainingRecords || trainingRecords.length === 0) {
        alert('ไม่มีข้อมูลให้ Export');
        return;
      }

      const json = JSON.stringify(trainingRecords, null, 2);
      downloadFile(json, 'training_records.json', 'application/json');
      showToast('Export JSON เรียบร้อยแล้ว', 'success');
    }

    function safeCsv(value) {
      const s = value === null || value === undefined ? '' : String(value);
      // escape double quotes
      const escaped = s.replace(/"/g, '""');
      // quote when needed
      return /[",\n]/.test(escaped) ? `"${escaped}"` : escaped;
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function downloadCertificate() {
      if (!currentCertificateData) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

      const record = currentCertificateData;

      doc.setFontSize(32);
      doc.setTextColor(102, 126, 234);
      doc.text('ใบประกาศนียบัตร', 148.5, 40, { align: 'center' });

      doc.setFontSize(14);
      doc.setTextColor(113, 128, 150);

    }

    /******************************************************************
     * Utilities
     ******************************************************************/
    function showToast(message, type = 'info') {
      const colors = {
        success: '#00b894',
        danger: '#d63031',
        warning: '#fdcb6e',
        info: '#667eea'
      };

      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: ${colors[type] || colors.info};
        color: white;
        padding: 1rem 1.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        z-index: 9999;
        font-weight: 600;
        animation: slideIn 0.3s ease-out;
      `;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease-out';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(400px); opacity: 0; } }
    `;
    document.head.appendChild(style);

    function debounce(fn, wait) {
      let t = null;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), wait);
      };
    }

    function escapeHtml(s) {
      const str = s === null || s === undefined ? '' : String(s);
      return str
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
